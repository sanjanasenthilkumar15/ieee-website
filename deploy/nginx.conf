# Example nginx site (reverse proxy + HTTPS). Put in /etc/nginx/sites-available/ieee-sb
# and link into sites-enabled. Certificates: the college's own, or Let's Encrypt (certbot).
server {
    listen 80;
    server_name ieee.rmkec.ac.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ieee.rmkec.ac.in;

    ssl_certificate     /etc/ssl/certs/ieee.rmkec.ac.in.crt;
    ssl_certificate_key /etc/ssl/private/ieee.rmkec.ac.in.key;

    # Admin uploads (several photos at once)
    client_max_body_size 60m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
